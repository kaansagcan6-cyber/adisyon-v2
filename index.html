<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Garson Sipariş</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background:#f1f5f9; color:#1e293b; padding-bottom: 120px; }
.ust { background:#1e293b; color:white; padding:1rem; position:sticky; top:0; z-index:100; display:flex; justify-content:space-between; align-items:center; gap:0.75rem; }
.ust-baslik { font-size:1.15rem; font-weight:bold; }
.baglanti { font-size:0.78rem; padding:0.3rem 0.7rem; border-radius:20px; background:#334155; white-space:nowrap; }
.baglanti.ok { background:#16a34a; }
.baglanti.hata { background:#dc2626; }
.icerik { padding:1rem; max-width:900px; margin:0 auto; }
.bolum { background:white; border-radius:12px; padding:1.1rem; margin-bottom:1rem; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.bolum-baslik { font-size:1rem; font-weight:bold; margin-bottom:0.9rem; color:#334155; }
.masa-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(90px,1fr)); gap:0.7rem; }
.masa-btn { padding:1.1rem 0.5rem; border:3px solid #cbd5e1; border-radius:10px; background:white; font-size:1rem; font-weight:bold; cursor:pointer; text-align:center; }
.masa-btn:active { transform:scale(0.96); }
.masa-btn.secili { border-color:#2563eb; background:#2563eb; color:white; }
.kategori-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(105px,1fr)); gap:0.6rem; margin-bottom:1rem; }
.kat-btn { padding:0.85rem 0.4rem; border:none; border-radius:10px; color:white; font-weight:bold; font-size:0.92rem; cursor:pointer; opacity:0.55; }
.kat-btn.aktif { opacity:1; box-shadow:0 0 0 3px rgba(0,0,0,0.12); }
.kat-btn:active { transform:scale(0.96); }
.kat-spagetti { background:#3b82f6; }
.kat-penne { background:#0891b2; }
.kat-3lu { background:#8b5cf6; }
.kat-atistirmalik { background:#f97316; }
.kat-icecek { background:#f59e0b; }
.arama { width:100%; padding:0.9rem; border:2px solid #e2e8f0; border-radius:10px; font-size:1rem; margin-bottom:0.8rem; }
.arama:focus { outline:none; border-color:#2563eb; }
.urun-listesi { max-height:290px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.urun-btn { width:100%; text-align:left; padding:0.9rem; border:none; border-bottom:1px solid #f1f5f9; background:white; font-size:0.97rem; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:0.5rem; }
.urun-btn:active { background:#eff6ff; }
.urun-btn.secili { background:#dbeafe; font-weight:bold; }
.urun-fiyat { color:#16a34a; font-weight:bold; white-space:nowrap; }
.secenekler { border-top:2px solid #f1f5f9; margin-top:0.9rem; padding-top:0.9rem; }
.boyut-grid, .adet-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0.6rem; margin-bottom:0.9rem; }
.sec-btn { padding:0.85rem 0.4rem; border:2px solid #cbd5e1; border-radius:10px; background:white; font-weight:bold; cursor:pointer; font-size:0.95rem; }
.sec-btn:active { transform:scale(0.96); }
.sec-btn.secili { border-color:#2563eb; background:#2563eb; color:white; }
.adet-satiri { display:flex; align-items:center; gap:0.9rem; margin-bottom:0.9rem; }
.adet-btn { width:52px; height:52px; border:2px solid #cbd5e1; border-radius:10px; background:white; font-size:1.5rem; font-weight:bold; cursor:pointer; }
.adet-btn:active { background:#e2e8f0; }
.adet-deger { font-size:1.5rem; font-weight:bold; min-width:46px; text-align:center; }
.etiket { font-size:0.85rem; color:#64748b; font-weight:bold; margin-bottom:0.5rem; }
.extra-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:0.5rem; margin-bottom:0.9rem; }
.extra-btn { padding:0.7rem 0.5rem; border:2px solid #bae6fd; border-radius:10px; background:#f0f9ff; color:#0369a1; font-size:0.85rem; font-weight:bold; cursor:pointer; text-align:left; }
.extra-btn.secili { background:#0ea5e9; color:white; border-color:#0ea5e9; }
.not-input { width:100%; padding:0.85rem; border:2px dashed #a78bfa; border-radius:10px; font-size:0.95rem; margin-bottom:0.9rem; background:#faf5ff; }
.ekle-btn { width:100%; padding:1.1rem; border:none; border-radius:12px; background:#2563eb; color:white; font-size:1.05rem; font-weight:bold; cursor:pointer; }
.ekle-btn:active { background:#1d4ed8; }
.ekle-btn:disabled { background:#cbd5e1; cursor:not-allowed; }
.sepet-satir { display:flex; justify-content:space-between; align-items:center; padding:0.85rem; background:#f8fafc; border-radius:10px; margin-bottom:0.6rem; gap:0.6rem; }
.sepet-bilgi { flex:1; min-width:0; }
.sepet-ad { font-weight:bold; font-size:0.97rem; }
.sepet-detay { font-size:0.83rem; color:#64748b; margin-top:0.15rem; }
.sepet-extra { font-size:0.83rem; color:#0284c7; }
.sepet-not { font-size:0.83rem; color:#7c3aed; font-style:italic; }
.sil-btn { background:#ef4444; color:white; border:none; border-radius:8px; padding:0.6rem 0.85rem; font-weight:bold; cursor:pointer; font-size:0.85rem; white-space:nowrap; }
.sil-btn:active { background:#dc2626; }
.bos-sepet { text-align:center; padding:1.5rem; color:#94a3b8; font-size:0.95rem; }
.alt-bar { position:fixed; bottom:0; left:0; right:0; background:white; border-top:1px solid #e2e8f0; padding:0.9rem 1rem; box-shadow:0 -4px 16px rgba(0,0,0,0.08); z-index:100; }
.alt-ic { max-width:900px; margin:0 auto; display:flex; align-items:center; gap:0.9rem; }
.alt-toplam { flex:1; }
.alt-toplam .kucuk { font-size:0.78rem; color:#64748b; }
.alt-toplam .buyuk { font-size:1.45rem; font-weight:bold; color:#16a34a; }
.gonder-btn { padding:1.1rem 1.6rem; border:none; border-radius:12px; background:#16a34a; color:white; font-size:1.05rem; font-weight:bold; cursor:pointer; }
.gonder-btn:active { background:#15803d; }
.gonder-btn:disabled { background:#cbd5e1; cursor:not-allowed; }
.toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:#1e293b; color:white; padding:0.9rem 1.4rem; border-radius:10px; font-weight:bold; z-index:500; opacity:0; transition:all 0.3s; pointer-events:none; max-width:90%; text-align:center; font-size:0.95rem; }
.toast.goster { opacity:1; transform:translateX(-50%) translateY(0); }
.uyari { background:#fef3c7; border:2px solid #f59e0b; color:#92400e; border-radius:10px; padding:0.9rem; margin-bottom:1rem; font-size:0.9rem; line-height:1.6; }
</style>
</head>
<body>

<div class="ust">
  <div class="ust-baslik">🍽️ Garson Sipariş</div>
  <div class="baglanti" id="baglantiDurum">Bağlanıyor...</div>
</div>

<div class="icerik">
  <div id="uyariAlani"></div>

  <div class="bolum">
    <div class="bolum-baslik">Masa Seçin</div>
    <div class="masa-grid" id="masaGrid"></div>
  </div>

  <div class="bolum" id="urunBolumu" style="display:none;">
    <div class="bolum-baslik">Ürün Seçin</div>
    <div class="kategori-grid">
      <button class="kat-btn kat-spagetti aktif" data-kat="spagetti" onclick="katSec('spagetti')">🍝 Spagetti</button>
      <button class="kat-btn kat-penne" data-kat="penne" onclick="katSec('penne')">🍝 Penne</button>
      <button class="kat-btn kat-3lu" data-kat="3lu" onclick="katSec('3lu')">🍱 3'lü Menü</button>
      <button class="kat-btn kat-atistirmalik" data-kat="atistirmalik" onclick="katSec('atistirmalik')">🍟 Atıştırmalık</button>
      <button class="kat-btn kat-icecek" data-kat="icecek" onclick="katSec('icecek')">🥤 İçecek</button>
    </div>
    <input type="text" class="arama" id="aramaKutusu" placeholder="Ürün ara..." oninput="urunleriCiz()" autocomplete="off">
    <div class="urun-listesi" id="urunListesi"></div>

    <div class="secenekler" id="secenekAlani" style="display:none;">
      <div id="boyutAlani">
        <div class="etiket">BOYUT</div>
        <div class="boyut-grid">
          <button class="sec-btn" onclick="boyutSec('Küçük', this)">Küçük</button>
          <button class="sec-btn" onclick="boyutSec('Orta', this)">Orta +20</button>
          <button class="sec-btn" onclick="boyutSec('Büyük', this)">Büyük +40</button>
        </div>
      </div>

      <div id="extraAlani">
        <div class="etiket">EXTRA</div>
        <div class="extra-grid" id="extraGrid"></div>
      </div>

      <div class="etiket">ADET</div>
      <div class="adet-satiri">
        <button class="adet-btn" onclick="adetDegistir(-1)">−</button>
        <div class="adet-deger" id="adetDeger">1</div>
        <button class="adet-btn" onclick="adetDegistir(1)">+</button>
      </div>

      <input type="text" class="not-input" id="notKutusu" placeholder="🗒️ Not (acısız, soğansız...)">
      <button class="ekle-btn" onclick="sepeteEkle()">Siparişe Ekle</button>
    </div>
  </div>

  <div class="bolum" id="sepetBolumu" style="display:none;">
    <div class="bolum-baslik">Sipariş Listesi</div>
    <div id="sepetListesi"></div>
  </div>
</div>

<div class="alt-bar" id="altBar" style="display:none;">
  <div class="alt-ic">
    <div class="alt-toplam">
      <div class="kucuk" id="altMasa">Masa —</div>
      <div class="buyuk" id="altTutar">₺0.00</div>
    </div>
    <button class="gonder-btn" id="gonderBtn" onclick="mutfagaGonder()">Mutfağa Gönder</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var MASA_SAYISI = 6;

var makarnaTarifleri = ["pesto alfredo","köri alfredo","penne alfredo","ton ton","ton balıklı special","kremantar","napoliten","krepesto","dori penne","spagetti bolonez","4 peynirli","arabiata","sosili penne","lezzet harikası","kekikli","misket makarna","mexico penne","tantuni penne","çıtır","kırmızı orman","orman perisi","barbeki tavuk","köri tavuk","pesto tavuk","4 peynir tavuk","kremalı mantarlı tavuk","kekikli tavuk","kremantarlı tavuk","sweet chili tavuk","milanesse tavuk","mexico tavuk"];

var makarnaFiyatlari = {
  "pesto alfredo":230,"köri alfredo":200,"penne alfredo":200,"ton ton":220,"ton balıklı special":230,
  "kremantar":200,"napoliten":180,"krepesto":200,"dori penne":210,"spagetti bolonez":230,"4 peynirli":210,
  "arabiata":180,"sosili penne":200,"lezzet harikası":210,"kekikli":200,"misket makarna":230,
  "mexico penne":190,"tantuni penne":210,"çıtır":210,"kırmızı orman":210,"orman perisi":210
};

var icecekler = [
  {ad:"cola(33cl)",fiyat:60},{ad:"fanta(33cl)",fiyat:60},{ad:"cola(1lt)",fiyat:100},{ad:"cola(20cl)",fiyat:50},
  {ad:"sprite",fiyat:60},{ad:"ice tea mango",fiyat:60},{ad:"ice tea karpuz",fiyat:60},
  {ad:"ice tea şeftali",fiyat:60},{ad:"ice tea limon",fiyat:60},{ad:"ayran",fiyat:50}
];

var menuListesi = [
  {ad:"3'lü menü - spagetti (örnek)",fiyat:280},
  {ad:"3'lü menü - penne (örnek)",fiyat:280},
  {ad:"3'lü menü - tavuklu (örnek)",fiyat:300}
];

var atistirmalikListesi = [
  {ad:"sarımsak ekmeği (örnek)",fiyat:80},
  {ad:"patates kızartması (örnek)",fiyat:90},
  {ad:"soğan halkası (örnek)",fiyat:90},
  {ad:"mozarella stick (örnek)",fiyat:100}
];

var extralar = [
  {ad:"extra mozerella",fiyat:30},{ad:"extra mısır",fiyat:30},{ad:"extra chedar",fiyat:30},
  {ad:"+30 gr ton balığı",fiyat:40},{ad:"extra doritos parçaları",fiyat:30},{ad:"+30 gr et parçaları",fiyat:50},
  {ad:"extra kaşar peyniri",fiyat:30},{ad:"+30 gr tavuk",fiyat:40},{ad:"+30 gr sosis",fiyat:30},
  {ad:"+30 gr mantar",fiyat:40},{ad:"+30 gr misket köfte",fiyat:50},{ad:"extra parmesan",fiyat:40}
];

var seciliMasa = null;
var aktifKat = 'spagetti';
var seciliUrun = null;
var seciliBoyut = '';
var seciliExtras = [];
var adet = 1;
var sepet = [];
var gonderiliyor = false;

function guvenli(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sunucuAdresi() {
  // Sayfa sunucudan açıldıysa aynı adrese gönderiyoruz
  if (location.protocol === 'http:' || location.protocol === 'https:') return '';
  return null; // dosyadan açılmış, sunucu yok
}

function baglantiKontrol() {
  var el = document.getElementById('baglantiDurum');
  var adres = sunucuAdresi();
  if (adres === null) {
    el.className = 'baglanti hata';
    el.textContent = 'Sunucu yok';
    document.getElementById('uyariAlani').innerHTML =
      '<div class="uyari"><strong>Bu sayfa dosyadan açılmış.</strong><br>' +
      'Siparişin kasaya gitmesi için kasadaki bilgisayarda <strong>sunucu.py</strong> çalışıyor olmalı ve ' +
      'bu sayfayı telefonunuzun tarayıcısına kasada yazan adresi yazarak açmalısınız ' +
      '(örnek: http://192.168.1.25:8765/garson.html)</div>';
    return;
  }
  fetch('/api/durum', {cache:'no-store'}).then(function(r){
    if (!r.ok) throw new Error('yanit yok');
    return r.json();
  }).then(function(){
    el.className = 'baglanti ok';
    el.textContent = '● Bağlı';
    document.getElementById('uyariAlani').innerHTML = '';
  }).catch(function(){
    el.className = 'baglanti hata';
    el.textContent = '● Bağlantı yok';
  });
}

function masalariCiz() {
  var g = document.getElementById('masaGrid');
  g.innerHTML = '';
  for (var i=1;i<=MASA_SAYISI;i++) {
    (function(no){
      var b = document.createElement('button');
      b.className = 'masa-btn' + (seciliMasa === no ? ' secili' : '');
      b.textContent = 'Masa ' + no;
      b.onclick = function(){ masaSec(no); };
      g.appendChild(b);
    })(i);
  }
}

function masaSec(no) {
  if (seciliMasa !== null && seciliMasa !== no && sepet.length > 0) {
    if (!confirm('Masa ' + seciliMasa + ' için gönderilmemiş sipariş var. Masa değiştirilsin mi? (Liste silinecek)')) return;
    sepet = [];
  }
  seciliMasa = no;
  masalariCiz();
  document.getElementById('urunBolumu').style.display = 'block';
  document.getElementById('altBar').style.display = 'block';
  document.getElementById('altMasa').textContent = 'Masa ' + no;
  urunleriCiz();
  sepetiCiz();
}

function katSec(kat) {
  aktifKat = kat;
  var btns = document.querySelectorAll('.kat-btn');
  for (var i=0;i<btns.length;i++) btns[i].classList.toggle('aktif', btns[i].getAttribute('data-kat') === kat);
  seciliUrun = null; seciliBoyut = ''; seciliExtras = []; adet = 1;
  document.getElementById('aramaKutusu').value = '';
  document.getElementById('secenekAlani').style.display = 'none';
  urunleriCiz();
}

function katListesi(kat) {
  if (kat === 'spagetti' || kat === 'penne')
    return makarnaTarifleri.map(function(a){ return {ad:a, fiyat: makarnaFiyatlari[a] || 0}; });
  if (kat === '3lu') return menuListesi;
  if (kat === 'atistirmalik') return atistirmalikListesi;
  if (kat === 'icecek') return icecekler;
  return [];
}

function urunleriCiz() {
  var liste = document.getElementById('urunListesi');
  var arama = (document.getElementById('aramaKutusu').value || '').toLowerCase();
  var kaynak = katListesi(aktifKat).filter(function(u){
    return !arama || u.ad.toLowerCase().indexOf(arama) !== -1;
  });
  liste.innerHTML = '';
  if (kaynak.length === 0) {
    liste.innerHTML = '<div class="bos-sepet">Ürün bulunamadı</div>';
    return;
  }
  kaynak.forEach(function(u){
    var b = document.createElement('button');
    b.className = 'urun-btn' + (seciliUrun && seciliUrun.ad === u.ad ? ' secili' : '');
    b.innerHTML = '<span>' + guvenli(u.ad) + '</span>' +
                  '<span class="urun-fiyat">' + (u.fiyat ? '₺' + u.fiyat : 'fiyat gir') + '</span>';
    b.onclick = function(){ urunSec(u); };
    liste.appendChild(b);
  });
}

function urunSec(u) {
  seciliUrun = u;
  seciliBoyut = ''; seciliExtras = []; adet = 1;
  document.getElementById('adetDeger').textContent = '1';
  document.getElementById('notKutusu').value = '';
  var btns = document.querySelectorAll('.boyut-grid .sec-btn');
  for (var i=0;i<btns.length;i++) btns[i].classList.remove('secili');

  var makarnaMi = (aktifKat === 'spagetti' || aktifKat === 'penne');
  document.getElementById('boyutAlani').style.display = makarnaMi ? 'block' : 'none';
  document.getElementById('extraAlani').style.display = (aktifKat === 'icecek') ? 'none' : 'block';
  document.getElementById('secenekAlani').style.display = 'block';

  extralariCiz();
  urunleriCiz();
  var sa = document.getElementById('secenekAlani');
  if (sa && sa.scrollIntoView) { try { sa.scrollIntoView({behavior:'smooth', block:'nearest'}); } catch(e) {} }
}

function extralariCiz() {
  var g = document.getElementById('extraGrid');
  g.innerHTML = '';
  extralar.forEach(function(e){
    var secili = seciliExtras.some(function(s){ return s.ad === e.ad; });
    var b = document.createElement('button');
    b.className = 'extra-btn' + (secili ? ' secili' : '');
    b.textContent = e.ad + ' +₺' + e.fiyat;
    b.onclick = function(){ extraAcKapa(e); };
    g.appendChild(b);
  });
}

function extraAcKapa(e) {
  var i = -1;
  for (var k=0;k<seciliExtras.length;k++) if (seciliExtras[k].ad === e.ad) i = k;
  if (i >= 0) seciliExtras.splice(i,1);
  else seciliExtras.push({ad:e.ad, fiyat:e.fiyat});
  extralariCiz();
}

function boyutSec(boyut, btn) {
  var btns = document.querySelectorAll('.boyut-grid .sec-btn');
  for (var i=0;i<btns.length;i++) btns[i].classList.remove('secili');
  btn.classList.add('secili');
  seciliBoyut = boyut;
}

function adetDegistir(fark) {
  adet = Math.max(1, adet + fark);
  document.getElementById('adetDeger').textContent = adet;
}

function birimFiyatHesapla() {
  if (!seciliUrun) return 0;
  var f = seciliUrun.fiyat || 0;
  if (aktifKat === 'spagetti' || aktifKat === 'penne') {
    if (seciliBoyut === 'Büyük') f += 40;
    else if (seciliBoyut === 'Orta') f += 20;
  }
  seciliExtras.forEach(function(e){ f += e.fiyat; });
  return f;
}

function sepeteEkle() {
  if (!seciliUrun) { toast('Önce ürün seçin'); return; }
  var fiyat = birimFiyatHesapla();
  if (!fiyat) {
    var elle = prompt('Bu ürünün fiyatı tanımlı değil. Birim fiyatı yazın (₺):', '');
    fiyat = parseFloat(elle);
    if (!fiyat || fiyat <= 0) { toast('Geçerli fiyat girilmedi'); return; }
    seciliExtras.forEach(function(e){ fiyat += e.fiyat; });
  }

  sepet.push({
    urun: seciliUrun.ad,
    kategori: aktifKat,
    boyut: seciliBoyut,
    extralar: seciliExtras.map(function(e){ return e.ad; }),
    adet: adet,
    birimFiyat: fiyat,
    not: (document.getElementById('notKutusu').value || '').trim()
  });

  seciliUrun = null; seciliBoyut = ''; seciliExtras = []; adet = 1;
  document.getElementById('secenekAlani').style.display = 'none';
  document.getElementById('aramaKutusu').value = '';
  document.getElementById('notKutusu').value = '';
  document.getElementById('adetDeger').textContent = '1';
  urunleriCiz();
  sepetiCiz();
  toast('✅ Eklendi');
}

function sepettenSil(i) {
  sepet.splice(i,1);
  sepetiCiz();
}

function sepetiCiz() {
  var bolum = document.getElementById('sepetBolumu');
  var liste = document.getElementById('sepetListesi');
  bolum.style.display = 'block';

  if (sepet.length === 0) {
    liste.innerHTML = '<div class="bos-sepet">Henüz ürün eklenmedi</div>';
  } else {
    var html = '';
    sepet.forEach(function(s, i){
      html += '<div class="sepet-satir"><div class="sepet-bilgi">';
      html += '<div class="sepet-ad">' + guvenli(s.urun) + (s.boyut ? ' (' + s.boyut + ')' : '') + '</div>';
      html += '<div class="sepet-detay">' + s.adet + ' × ₺' + s.birimFiyat.toFixed(2) + ' = ₺' + (s.adet*s.birimFiyat).toFixed(2) + '</div>';
      if (s.extralar.length) html += '<div class="sepet-extra">+ ' + guvenli(s.extralar.join(', ')) + '</div>';
      if (s.not) html += '<div class="sepet-not">' + guvenli(s.not) + '</div>';
      html += '</div><button class="sil-btn" onclick="sepettenSil(' + i + ')">Sil</button></div>';
    });
    liste.innerHTML = html;
  }

  var toplam = sepet.reduce(function(t,s){ return t + s.adet*s.birimFiyat; }, 0);
  document.getElementById('altTutar').textContent = '₺' + toplam.toFixed(2);
  document.getElementById('gonderBtn').disabled = (sepet.length === 0 || gonderiliyor);
}

function mutfagaGonder() {
  if (!seciliMasa || sepet.length === 0 || gonderiliyor) return;
  if (sunucuAdresi() === null) {
    alert('Sunucuya bağlı değilsiniz.\n\nKasadaki bilgisayarda sunucu.py çalışıyor olmalı ve bu sayfayı kasada yazan adresten açmalısınız.');
    return;
  }

  gonderiliyor = true;
  var btn = document.getElementById('gonderBtn');
  btn.disabled = true;
  btn.textContent = 'Gönderiliyor...';

  fetch('/api/siparis', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ masa: seciliMasa, urunler: sepet })
  }).then(function(r){
    if (!r.ok) throw new Error('Sunucu hatası');
    return r.json();
  }).then(function(){
    toast('🎉 Masa ' + seciliMasa + ' siparişi mutfağa gönderildi');
    sepet = [];
    seciliUrun = null; seciliBoyut = ''; seciliExtras = []; adet = 1;
    document.getElementById('secenekAlani').style.display = 'none';
    sepetiCiz();
    baglantiKontrol();
  }).catch(function(e){
    alert('Sipariş gönderilemedi!\n\n' + e.message + '\n\nKasadaki sunucunun açık olduğundan ve aynı Wi-Fi ağında olduğunuzdan emin olun. Sipariş listeniz silinmedi, tekrar deneyebilirsiniz.');
    baglantiKontrol();
  }).then(function(){
    gonderiliyor = false;
    btn.textContent = 'Mutfağa Gönder';
    sepetiCiz();
  });
}

function toast(mesaj) {
  var t = document.getElementById('toast');
  t.textContent = mesaj;
  t.classList.add('goster');
  clearTimeout(t._z);
  t._z = setTimeout(function(){ t.classList.remove('goster'); }, 2500);
}

masalariCiz();
baglantiKontrol();
setInterval(baglantiKontrol, 15000);
</script>
</body>
